name: Excel sidecar check

on:
  pull_request:
    paths: ["**/*.xlsx", "**/*.xlsm", "**/*.xlsx.txt", "tools/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Verify every workbook has an up-to-date .txt sidecar
        run: python tools/sync_sidecars.py --check
